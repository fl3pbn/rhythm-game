<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>COMPÁS FLAMENCO - Soleá</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <h1>💃 COMPÁS FLAMENCO</h1>
      <p class="sub">SOLEÁ — 12拍のコンパスを感じよう</p>
      <canvas id="game" width="760" height="620"></canvas>
      <div class="controls">
        <button id="start">▶ スタート</button>
        <button id="mode">数字表示：ON</button>
        <button id="reset">↺ リセット</button>
      </div>
      <div class="help">
        画面の <b>「12・3・6・8・10」</b> に合わせて
        <b>Space</b> または画面クリック！
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
